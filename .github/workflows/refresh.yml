name: refresh-matzpen-data

on:
  schedule:
    - cron: '0 4 1,15 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r nadlan_pipeline/requirements.txt

      - name: Run pipeline
        working-directory: nadlan_pipeline
        run: python build.py

      - name: Commit updated data
        run: |
          git config user.name  "nadlan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add nadlan_analytics.html nadlan_pipeline/output/cities.json nadlan_pipeline/output/refresh_report.md
          git diff --staged --quiet || git commit -m "auto data refresh $(date +%F)"
          git push
