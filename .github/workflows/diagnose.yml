name: diagnose-sources
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r nadlan_pipeline/requirements.txt
      - working-directory: nadlan_pipeline
        run: python diagnose.py
      - run: |
          git config user.name "nadlan-bot"
          git config user.email "bot@users.noreply.github.com"
          git add nadlan_pipeline/output/diagnostics.md
          git diff --staged --quiet || git commit -m "diagnostics"
          git push
